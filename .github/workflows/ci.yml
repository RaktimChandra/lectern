name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "./backend[dev]"
      - name: Offline test suite (no keys, recorded provider replies)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t lectern:ci .
      - name: Smoke test
        run: |
          docker run -d --name lectern -p 8000:8000 -e ACCESS_TOKEN=ci-secret lectern:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health && break; sleep 1; done
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/lessons)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Lectern-Key: ci-secret' http://localhost:8000/api/lessons)" = "200"
